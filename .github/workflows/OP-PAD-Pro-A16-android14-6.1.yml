name: Build OnePlus Pad Pro OOS16 Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: '是否直接创建一个 GitHub Release 产物发布？'
        required: true
        type: boolean
        default: false
      op_model:
        description: '系统大版本选择（一加平板 Pro OOS16 专属固定为 A16）'
        required: true
        type: choice
        options:
          - A16
        default: A16
      ksu_options:
        description: 'BakaSU 强隐方案配置 JSON'
        required: true
        type: string
        default: '[{"type":"bakasu","hash":"main"}]'
      optimize_level:
        description: "编译器优化等级（一加魔改驱动务必首选 O2）"
        required: true
        type: choice
        options: [O2, O3]
        default: O2
      clean_build:
        description: '全新编译（不使用 ccache 缓存）'
        type: boolean
        default: false
      debug:
        description: '启用 Debug 调试模式输出日志'
        required: false
        type: boolean
        default: false
      mirror_toolchains:
        description: '编译前是否同步工具链'
        required: false
        type: boolean
        default: false
      build_timestamp:
        description: '自定义内核内核编译时间戳（uname -a）。留空则使用当前最新时间。'
        type: string
        default: ''
      android14-6_1_susfs_branch_or_commit:
        description: '6.1 内核专属 SUSFS 分支名称（请勿改动）'
        type: string
        default: 'gki-android14-6.1'

jobs:
  set-op-model:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      device_count: ${{ steps.set-matrix.outputs.count }}
      active_gki_keys: ${{ steps.set-matrix.outputs.active_gki_keys }}
      susfs_hash_android14_6_1:  ${{ steps.set-matrix.outputs.susfs_hash_android14_6_1 }}
      ksu_resolved_hash:    ${{ steps.set-matrix.outputs.ksu_resolved_hash }}
      ksu_options_normalized: ${{ steps.set-matrix.outputs.ksu_options_normalized }}
      susfs_base_version: ${{ steps.set-matrix.outputs.susfs_base_version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_HTTP_TIMEOUT: 600
    steps:
      - name: 📥 Checkout Code (to access configs/)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            configs/
          sparse-checkout-cone-mode: false

      - name: 🔍 Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Matrix generation"
          
          ksu_options_raw='${{ github.event.inputs.ksu_options }}'
          if ! ksu_options_normalized=$(echo "$ksu_options_raw" | jq -c 'map(if .type then .type |= ascii_upcase | if .hash == null then if .type == "KSUN" then .hash = "dev" elif .type == "KSU" then .hash = "main" else .hash end else . end else error("No type found") end)' 2>&1); then
            echo "::error::ksu_options validation failed: $ksu_options_normalized"
            exit 1
          fi
          
          echo "ksu_options_normalized=$ksu_options_normalized" >> $GITHUB_OUTPUT
          
          echo "[" > matrix.json
          mapfile -t all_json_files < <(find configs/ -name "*.json" -print0 | xargs -0 -n1)
          for i in "${!all_json_files[@]}"; do
            file="${all_json_files[$i]}"
            if [ -f "$file" ]; then
              jq -r '.' "$file" >> matrix.json
              if [ $((i+1)) -lt ${#all_json_files[@]} ]; then
                echo "," >> matrix.json
              fi
            fi
          done
          echo "]" >> matrix.json
          
          # 强制锁定过滤：只寻找配置里属于一加平板Pro、且是 A16 / 6.1 内核的配置
          jq_filter="map(select(.os_version == \"A16\" and .kernel_version == \"6.1\"))"
          
          filtered=$(jq -c "$jq_filter" matrix.json)
          count=$(jq 'length' <<<"$filtered")
          
          if [ "$count" -eq 0 ]; then
            echo "::error::未在 configs/ 目录中发现任何匹配 A16 且内核为 6.1 的一加平板 Pro 配置文件！"
            exit 1
          fi
          
          echo "$filtered" | jq '.' > matrix.json
          echo "$ksu_options_normalized" > ksu_temp.json
          
          merged_matrix=$(jq -n \
            --slurpfile devices matrix.json \
            --slurpfile ksu_list ksu_temp.json \
            '[ $devices[0][] as $dev | $ksu_list[0][] as $ksu | ($dev + {ksu_type: $ksu.type, ksu_hash: $ksu.hash}) ]')
          
          rm ksu_temp.json
          final_count=$(echo "$merged_matrix" | jq 'length')
          
          echo "✅ Found $final_count device(s) to build"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          
          ksu_type=$(echo "$ksu_options_normalized" | jq -r '.[0].type')
          ksu_ref=$(echo "$ksu_options_normalized" | jq -r '.[0].hash')
          
          # 动态匹配 BakaSU 仓库地址
          if [ "$ksu_type" == "BAKASU" ]; then
            KSU_REPO_OWNER="Baka-SU"
            KSU_REPO_NAME="BakaSU"
          elif [ "$ksu_type" == "KSUN" ]; then
            KSU_REPO_OWNER="KernelSU-Next"
            KSU_REPO_NAME="KernelSU-Next"
          else
            KSU_REPO_OWNER="tiann"
            KSU_REPO_NAME="KernelSU"
          fi
          
          HEAD_REF="refs/heads/${ksu_ref}"
          TAG_REF="refs/tags/${ksu_ref}"
          
          QUERY='query($owner: String!, $name: String!, $headRef: String!, $tagRef: String!, $objRef: String!) {
            repository(owner: $owner, name: $name) {
              hb: ref(qualifiedName: $headRef) { t: target { ... on Commit { o: oid } } }
              ht: ref(qualifiedName: $tagRef) { t: target { ... on Commit { o: oid } } }
              ho: object(expression: $objRef) { ... on Commit { o: oid } }
            }
          }'
          
          RESULT=$(gh api graphql -f query="$QUERY" -f owner="$KSU_REPO_OWNER" -f name="$KSU_REPO_NAME" -f headRef="$HEAD_REF" -f tagRef="$TAG_REF" -f objRef="$ksu_ref" 2>/dev/null || echo "")
          resolved_sha=$(echo "$RESULT" | jq -r '.data.repository | (.hb.t.o // .ht.t.o // .ho.o // "unknown")' 2>/dev/null || echo "unknown")
          
          if [ "$resolved_sha" == "unknown" ] || [ -z "$resolved_sha" ]; then
            # 容错：如果 GraphQL API 因私有或网络解析不到，回退使用主分支
            resolved_sha="main"
          fi
          
          echo "ksu_resolved_hash=$resolved_sha" >> "$GITHUB_OUTPUT"
          merged_matrix=$(echo "$merged_matrix" | jq  --arg resolved_sha "$resolved_sha" 'map(.ksu_resolved_hash = $resolved_sha)')
          
          GITLAB_PROJECT_PATH="simonpunk/susfs4ksu"
          user_val="${{ inputs.android14-6_1_susfs_branch_or_commit }}"
          
          # 云端拉取 6.1 内核对应的 SUSFS 补丁 Hash
          GL_QUERY="{ project(fullPath: \"${GITLAB_PROJECT_PATH}\") { repository { ch: commit(ref: \"${user_val}\") { sha } blobs(paths: [\"kernel_patches/include/linux/susfs.h\"], ref: \"${user_val}\") { nodes { rawBlob } } } } }"
          RESPONSE=$(curl -s --fail -G "https://gitlab.com" --data-urlencode "query=$GL_QUERY" || echo "")
          resolved=$(echo "$RESPONSE" | jq -r '.data.project.repository.ch.sha // empty' 2>/dev/null || echo "")
          
          if [ -z "$resolved" ]; then
            resolved="gki-android14-6.1"
          fi
          
          extracted=$(echo "$RESPONSE" | jq -r '.data.project.repository.blobs.nodes[0].rawBlob // empty' 2>/dev/null | grep '#define SUSFS_VERSION' | awk -F'"' '{print $2}' || echo "unknown")
          echo "susfs_base_version=${extracted:-unknown}" >> "$GITHUB_OUTPUT"
          
          echo "active_gki_keys=android14-6.1" >> "$GITHUB_OUTPUT"
          echo "susfs_hash_android14_6_1=$resolved"   >> "$GITHUB_OUTPUT"
          
          susfs_hashes_json=$(jq -n --arg a14 "$resolved" '{"android14-6.1": $a14}')
          echo "$susfs_hashes_json" > susfs_lookup_temp.json
          merged_matrix=$(echo "$merged_matrix" | jq \
            --slurpfile hashes_array susfs_lookup_temp.json \
            '($hashes_array[0]) as $hashes | [.[] | . + {susfs_resolved_hash: ($hashes["\(.android_version)-\(.kernel_version)"] // "unknown")}]')
          
          rm susfs_lookup_temp.json
          echo "$merged_matrix" > final_matrix_temp.json
          wrapped=$(jq --slurp '{ include: .[] }' final_matrix_temp.json)
          echo "matrix=$(echo "$wrapped" | jq -c .)" >> "$GITHUB_OUTPUT"
          rm final_matrix_temp.json
          echo "::endgroup::"

      - name: Upload build matrix
        uses: actions/upload-artifact@v7
        with:
          name: build-matrix
          path: matrix.json
          archive: false
          retention-days: 7

  mirror_toolchain:
    needs: set-op-model
    if: ${{ inputs.mirror_toolchains }}
    uses: ./.github/workflows/mirror-toolchains.yml
    secrets: inherit

  prepare_ccache:
    name: Prepare ccache binary (download once)
    runs-on: ubuntu-latest
    steps:
      - name: Download custom ccache once
        run: |
          set -uo pipefail
          url="https://githubusercontent.com"
          curl -LfsS --connect-timeout 30 --max-time 120 -H "User-Agent: Mozilla/5.0" "$url" -o ccache && chmod +x ccache
      - name: Upload ccache artifact
        uses: actions/upload-artifact@v7
        with:
          name: ccache-binary
          path: ccache
          retention-days: 1

  build:
    name: build (${{ matrix.model }}, OOS16-6.1)
    needs: [set-op-model, mirror_toolchain, prepare_ccache]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-op-model.outputs.matrix) }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 🧹 Emergency Disk Cleanup
        if: ${{ matrix.disk_cleanup }}
        uses: ./.github/actions/disk-cleanup

      - name: Install Minimal Dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
